<div class="app" id="app"></div>

<script src="i18n.js?v=2.31.0"></script>
<script src="i18n-vs.js?v=2.31.0"></script>

<script>
/* =====================================================================
   MOGAS · Generador de la dieta en .docx (Word / Google Docs)
   Sin librerías: escribe el XML de Word y lo empaqueta en un ZIP.
   Uso: const bytes = MogasDoc.build(dieta, {headerPng, footerPng}) -> Uint8Array
   ===================================================================== */
(function(global){
  const DARK="657E52", LIGHT="93B482", BLUE="0B9BDB", GREY="404040", FONT="Montserrat";
  const MM=36000, TW=56.7;                // EMU y twips por mm
  const PAGE_W=210, PAGE_H=297, ML=25, MR=25, TEXT_W=PAGE_W-ML-MR;

  const x = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  /* ---------- runs y párrafos ---------- */
  function run(t, o={}){
    const pr=[`<w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}"/>`];
    if(o.b) pr.push("<w:b/>");
    if(o.i) pr.push("<w:i/>");
    if(o.caps) pr.push("<w:caps/>");
    pr.push(`<w:color w:val="${o.color||GREY}"/>`);
    pr.push(`<w:sz w:val="${o.sz||22}"/><w:szCs w:val="${o.sz||22}"/>`);
    if(o.u) pr.push('<w:u w:val="single"/>');
    if(o.shade) pr.push(`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`);
    return `<w:r><w:rPr>${pr.join("")}</w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  }
  function para(runs, o={}){
    const pr=[];
    if(o.keep) pr.push("<w:keepNext/>");
    pr.push(`<w:spacing w:before="${o.before||0}" w:after="${o.after==null?40:o.after}" w:line="${o.line||264}" w:lineRule="auto"/>`);
    if(o.align) pr.push(`<w:jc w:val="${o.align}"/>`);
    return `<w:p><w:pPr>${pr.join("")}</w:pPr>${Array.isArray(runs)?runs.join(""):runs}</w:p>`;
  }
  const vacio = () => para(run(""),{after:0});

  /* ---------- bloques de contenido ---------- */
  // h: título de sección verde (Cafés del día, Desayuno…)
  // l: etiqueta negra subrayada + texto azul (Hidratos de carbono: Escoger…)
  // o: opción con prefijo en negrita (A- 60 gr de…)
  // t: texto normal · tb: texto en negrita · total: Total KCAL
  function bloque(b){
    switch(b.k){
      case "h":  return para([run(b.t,{b:true,u:true,color:DARK,sz:23}), b.extra?run(" "+b.extra,{sz:21}):""],{before:b.first?0:160,keep:true});
      case "l":  return para([run(b.t,{b:true,u:true,color:"000000"}), b.azul?run(" "+b.azul,{b:true,color:BLUE}):""],{before:120,keep:true});
      case "azul": return para(run(b.t,{b:true,color:BLUE}),{keep:true});
      case "o":  return para([run(b.p,{b:true,color:"000000"}), run(b.t)]);
      case "tb": return para(run(b.t,{b:true,color:"000000"}),{before:b.before||0});
      case "t":  return para(run(b.t));
      case "esp":return vacio();
      case "total": return para(run(`Total KCAL:${b.kcal}`,{u:true,shade:LIGHT,color:"000000"}),{align:"right",before:120,after:0});
      default: return "";
    }
  }
  // caja con borde verde (el "cajetín" de cada comida)
  function caja(bloques){
    const brd=["top","left","bottom","right"].map(s=>`<w:${s} w:val="single" w:sz="8" w:space="0" w:color="${DARK}"/>`).join("");
    const w=Math.round(TEXT_W*TW);
    return `<w:tbl><w:tblPr><w:tblW w:w="${w}" w:type="dxa"/><w:tblBorders>${brd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="120" w:type="dxa"/><w:left w:w="140" w:type="dxa"/><w:bottom w:w="120" w:type="dxa"/><w:right w:w="140" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid><w:gridCol w:w="${w}"/></w:tblGrid><w:tr><w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr>${bloques.map(bloque).join("")||vacio()}</w:tc></w:tr></w:tbl>`+para(run(""),{after:200});
  }

  /* ---------- imagen flotante (cabecera y pie) ---------- */
  function imagenFlotante(rid, id, wmm, hmm, ymm){
    const cx=Math.round(wmm*MM), cy=Math.round(hmm*MM);

const TODAS_COMIDAS = ["Desayuno","Segundo desayuno","Comida","Merienda","Cena","Pre-cama"];
const POS = {"Desayuno":0,"Segundo desayuno":1,"Comida":2,"Merienda":3,"Cena":4,"Pre-cama":5};
const BASE = {"Desayuno":22,"Segundo desayuno":8,"Comida":35,"Merienda":8,"Cena":35,"Pre-cama":12};
const ENTRENOS = {
  no:{t:"No entrena / variable", pos:null},
  ayunas:{t:"Mañana en ayunas (al levantarse)", pos:-0.5},
  manana:{t:"Media mañana (después de desayunar)", pos:0.5},
  mediodia:{t:"Mediodía (antes de comer)", pos:1.5},
  tarde1:{t:"Primera hora de la tarde", pos:2.5},
  tarde:{t:"Tarde-noche (antes de cenar)", pos:3.5}
};
const HAMBRE = {igual:"Igual todo el día", manana:"Más hambre por la mañana", noche:"Más hambre por la noche"};
function prePost(ent=FICHA.entreno){
  const p=ENTRENOS[ent].pos; if(p===null) return {};
  const cs=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b]);
  return {pre:[...cs].reverse().find(c=>POS[c]<p), post:cs.find(c=>POS[c]>p)};
}
function repartoAuto(ent=FICHA.entreno){
  const w={}; FICHA.comidas.forEach(c=>w[c]=BASE[c]);
  const m=(c,f)=>{if(w[c]!=null)w[c]*=f};
  if(FICHA.hambre==="noche"){m("Desayuno",.8);m("Segundo desayuno",.9);m("Comida",.95);m("Cena",1.2);m("Pre-cama",1.2);}
  if(FICHA.hambre==="manana"){m("Desayuno",1.3);m("Segundo desayuno",1.2);m("Cena",.85);m("Pre-cama",.8);}
  if(FICHA.sinHambreManana){m("Desayuno",.6);}
  const {pre,post}=prePost(ent); if(pre)m(pre,1.15); if(post)m(post,1.25);
  // a porcentajes enteros que sumen 100
  const tot=Object.values(w).reduce((a,b)=>a+b,0), r={}; let acc=0;
  const fr=Object.keys(w).map(c=>{const x=w[c]/tot*100;r[c]=Math.floor(x);acc+=r[c];return [c,x-r[c]]}).sort((a,b)=>b[1]-a[1]);
  for(let i=0;i<100-acc;i++) r[fr[i%fr.length][0]]++;
  return r;
}
const reparto = () => FICHA.reparto && FICHA.comidas.every(c=>FICHA.reparto[c]!=null) ? FICHA.reparto : repartoAuto();

const restr = () => (FICHA.restricciones||[]).map(k=>RESTRICCIONES[k]).filter(Boolean);

let LANG = (()=>{ try{ return localStorage.getItem("mogas-lang")||"es"; }catch(e){ return "es"; } })();
const NUM_RE = /\d+(?:[.,]\d+)*½?|½/g;
function trT(t){
  if(LANG==="es" || !window.I18N || !I18N[LANG]) return t;
  const lead=t.match(/^\s*/)[0], trail=t.match(/\s*$/)[0], nums=[];
  const key=t.replace(/\s+/g," ").trim().replace(NUM_RE,m=>{nums.push(m);return "#";});
  const v=I18N[LANG][key]; if(v==null) return t;
  let i=0; return lead+v.replace(/#/g,()=>nums[i++]??"#")+trail;
}
function traducir(el){
  if(LANG==="es") return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const ns=[]; while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{ if(n.parentNode && n.parentNode.closest && n.parentNode.closest(".langsel,.notr")) return; const v=trT(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; });
  if(el.querySelectorAll) el.querySelectorAll("input[placeholder]").forEach(i=>i.placeholder=trT(i.placeholder));
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) traducir(n); else if(n.nodeType===3){ const v=trT(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; } }))).observe(document.getElementById("app"),{childList:true,subtree:true});

const LETRAS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const compLinea = c => c ? c.op.join(" / ") : "";
function recetasDoc(comida){
  const T=kcalComida(comida); if(!T) return null; const L=recetasPara(comida,T); if(!L.length) return null;
  const out=[], bocs=L.filter(esBocadillo), agrupar=bocs.length>=2;
  const pref = n => agrupar ? `${n+1})` : `${LETRAS[n]})`;
  const compDoc = c => c ? [{k:"o",p:`+ Para completar (≈${c.kcal} Kcal), añade: `,t:adaptarTexto(compLinea(c))}] : [];
  let n=0;
  // bocadillos y tostadas: un solo bloque con el pan común y un relleno por opción
  if(agrupar){
    const es=bocs.map(r=>escalar(r,T)), pg=panComun(T), media=Math.round(es.reduce((a,e)=>a+e.kcal,0)/es.length);
    const tipos=new Set(bocs.map(r=>r.i.find(([id])=>PANES.includes(id))[0]));
    const pan = tipos.size>1 ? `${pg} g de pan (mejor integral)` : lineaIng([...tipos][0], pg);
    const comp = complemento(T-media);
    out.push({k:"l",t:`${pref(n++)} BOCADILLO O TOSTADA (≈${comp?T:media} Kcal)`,azul:""});
    out.push({k:"o",p:"Base para todas: ",t:adaptarTexto(pan)});
    bocs.forEach((r,j)=>{ const e=es[j];
      const partes=e.items.filter(([id])=>!PANES.includes(id)).map(([id,q])=> id==="aove" ? `${q} g de AOVE` : lineaIng(id,q));
      out.push({k:"o",p:`${LETRAS[j]}- `,t:adaptarTexto(partes.join(" + ")+(r.nota?` (${r.nota})`:""))}); });
    out.push(...compDoc(comp));
    out.push({k:"esp"});
  }
  L.filter(r=>!agrupar||!esBocadillo(r)).forEach(r=>{ const e=escalar(r,T); out.push({k:"l",t:`${pref(n++)} ${adaptarTexto(r.n).toUpperCase()} (≈${e.comp?T:e.kcal} Kcal)`,azul:""});
    e.items.forEach(([id,q])=>out.push({k:"o",p:"•  ",t:adaptarTexto(lineaIng(id,q))}));
    out.push(...compDoc(e.comp));
    (r.p||[]).forEach((x,n)=>out.push({k:"o",p:`${n+1}. `,t:x})); out.push({k:"esp"}); });
  return out;
}

/* Crea la dieta como documento de Google en el Drive del nutricionista (o la descarga en .docx) */
async function generarDoc(btn, out){
  const R=reparto(), suma=FICHA.comidas.reduce((a,c)=>a+(+R[c]||0),0);
  if(suma!==100){ out.innerHTML=`<p class="warn">Antes de generar la dieta, el reparto de comidas tiene que sumar 100%.</p>`; return; }
  const titulo = dietaParaDoc().titulo;
  btn.disabled=true; const txt=btn.textContent; btn.textContent="Generando documento…"; out.innerHTML="";
  try{
    const bytes = await docxBytes();
    const mcp = window.claude ? await window.claude.use("mcp").catch(()=>null) : null;
    if(mcp){
      try{
        const res = await mcp.callTool("Google Drive","create_file",{title:titulo, base64Content:MogasDoc.bytesToB64(bytes), contentMimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
        const f = res.payload||{};
        const url = f.viewUrl || (f.id?`https://docs.google.com/document/d/${f.id}/edit`:null);
        out.innerHTML = url ? `<p class="ok">✅ Dieta creada en tu Google Drive.</p><a class="doclink" href="${esc(url)}" target="_blank" rel="noopener">Abrir «${esc(titulo)}» en Google Docs</a>` : `<p class="ok">✅ Dieta creada en tu Google Drive como «${esc(titulo)}».</p>`;
      }catch(e){
        const code=e&&e.code;
        const msg = code==="needs_reauth" ? "Tienes que volver a conectar Google Drive en claude.ai (Ajustes → Conectores)."
          : code==="server_not_connected" ? "Google Drive no está conectado. Añádelo en claude.ai (Ajustes → Conectores)."
          : code==="approval_required"||code==="not_in_manifest" ? "Hace falta que permitas que esta app use Google Drive. Ábrela en claude.ai y acepta el permiso."
          : code==="server_unavailable"||code==="upstream_error" ? "Google Drive no ha respondido. Puede que el documento se haya creado igualmente: revisa tu Drive antes de volver a intentarlo."
          : "No se ha podido crear el documento en Google Drive.";
        out.innerHTML=`<p class="warn">${esc(msg)}</p>`;
      }
    } else {
      const dl = window.claude ? await window.claude.use("downloads").catch(()=>null) : null;
      if(dl){ await dl.save({filename:titulo.replace(/[\\/:*?"<>|]/g,"")+".docx", data:new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})});
        out.innerHTML=`<p class="ok">✅ Dieta descargada en Word. Súbela a Google Drive para editarla como documento de Google.</p>`; }
      else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})); a.download=titulo.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ()_.-]/g,"").trim()+".docx"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000);
        out.innerHTML=`<p class="ok">✅ Dieta descargada en Word (.docx).</p><p class="note">Para editarla como documento de Google: súbela a tu Google Drive y ábrela con Google Docs. También se puede abrir directamente con Word o Pages.</p>`; }
    }
  }catch(e){ out.innerHTML=`<p class="warn">No se ha podido generar el documento.</p>`; }
  btn.disabled=false; btn.textContent=txt;
}

const b64u = {
  enc: u8 => { let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec: t => { t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

async function streamBytes(u8, Ctor, fmt){ const st=new Blob([u8]).stream().pipeThrough(new Ctor(fmt)); return new Uint8Array(await new Response(st).arrayBuffer()); }
async function empaquetar(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=="undefined"){ try{ return "z"+b64u.enc(await streamBytes(raw,CompressionStream,"deflate-raw")); }catch(e){} }
  return "j"+b64u.enc(raw);
}

}

function redondear(u,q){ if(u==="ud") return Math.max(1,Math.round(q)); return Math.max(1,redondo(q)); }
const kcalIng = (id,q) => { const g=ING[id]; if(!g||g.fijo) return 0; return g.u==="ud" ? g.k*q : g.k*q/100; };

const topeDe = id => { const m=regla(id).max; return typeof m==="function" ? m() : (m??Infinity); };
function ajustarQ(id, q, redU=Math.round){
  const g=ING[id], R=regla(id); if(g.fijo) return q;
  if(R.fija) return R.fija;
  if(R.pasos) return R.pasos.reduce((a,b)=>Math.abs(b-q)<Math.abs(a-q)?b:a);
  let v;
  if(g.u==="ud") v=Math.max(1,redU(q));
  else { const paso=R.paso||(g.u==="ml"&&q>=100?50:5); v=Math.max(R.min||paso, Math.round(q/paso)*paso); }
  return Math.min(v, topeDe(id));

/* Bocadillos y tostadas: todos llevan el mismo pan (panComun) y se recalcula solo el relleno.
   Si la comida tiene muchas kcal, el bocadillo se queda en un tamaño razonable y se completa aparte (fruta, kéfir o frutos secos). */
const PANES = ["panBl","panInt"], TB_MAX = 480;
const esBocadillo = r => r.i.some(([id])=>PANES.includes(id));
const tamBoc = T => Math.min(T, Math.max(TB_MAX, T-250));   // lo que pasa de ahí va al complemento (máx. ≈250 kcal)
const panComun = T => Math.min(120, Math.max(30, Math.round(60*tamBoc(T)/330/5)*5));   // 60 g para ≈330 kcal
function complemento(resto){
  if(!(resto>=60)) return null;
  const tope=topeDe("frSecos"), fs = n => Math.min(tope, Math.max(10, Math.round(n/6.1/5)*5));
  const op=[];
  op.push(resto<=115 ? "1 pieza de fruta" : resto<=175 ? "2 piezas de fruta" : resto<=260 ? `1 pieza de fruta + ${fs(resto-80)} g de frutos secos` : `2 piezas de fruta + ${fs(resto-160)} g de frutos secos`);
  op.push(resto<=135 ? "1 kéfir o yogur bebible" : "1 kéfir o yogur bebible + 1 pieza de fruta");
  if(Math.abs(fs(resto)*6.1-resto)<=resto*0.25) op.push(`${fs(resto)} g de frutos secos`);
  return {kcal:Math.round(resto/10)*10, op};
}
function escalar(r, T){

  const q1 = r.i.map(([id,q])=> boc&&PANES.includes(id) ? pg : regla(id).fija || q);
  const base=recetaKcal(r,q1), fijoK=r.i.reduce((a,[id],j)=>a+(esFijo(id)?kcalIng(id,q1[j]):0),0);
  const lo=boc?0.3:0.5, hi=boc?2.5:2;

  // afina los ingredientes en gramos (del más calórico al menos) para acercarse a Tb, sin pasar sus topes
  const afinar = qs => { qs=[...qs]; let dev=0;
    const js=r.i.map((x,j)=>j).filter(j=>{const id=r.i[j][0]; return ING[id].u==="g"&&!esFijo(id)&&!regla(id).pasos;}).sort((a,b)=>kcalIng(r.i[b][0],qs[b])-kcalIng(r.i[a][0],qs[a]));

      if(nq>0 && nq<=q0*2.2 && nq>=q0*0.4){ qs[j]=nq; dev+=Math.abs(Math.log(nq/q0)); } }

  // unidades (lonchas, latas, huevos) redondeadas o por debajo: se queda la que deja el relleno más proporcionado

    prot = resto*pesoC(c)/tot; }
  else prot = T*0.33/4.8;
  const nExtra = 1, conPostre = FICHA.postrePrincipal!==false;
  // que siempre quepa algo de hidrato (salvo cena sin hidratos)
  const fijoK = KCAL_VERD + KCAL_AOVE5 + nExtra*KCAL_EXTRA + (conPostre?KCAL_POSTRE:0);
  // tope por comida: que quepa al menos ½ ración de hidratos (salvo cena sin hidratos); comida y cena llevan la misma proteína
  const capDe = x => { const sh = x==="Cena" && FICHA.cenaSinHC; return (kcalComida(x) - fijoK - (sh?0:RACION_HC/2))/4.8 / ((x==="Cena"&&FICHA.cenaSinHC)?1.15:1); };
  const capComun = Math.min(...principales.map(capDe)) * (cenaSinHC?1.15:1);
  const protPedida = prot;
  prot=Math.max(20,Math.min(75,prot,capComun));
  const kProt = prot*4.8;
  let kHC = cenaSinHC ? 0 : T - kProt - KCAL_VERD - KCAL_AOVE5 - nExtra*KCAL_EXTRA - (conPostre?KCAL_POSTRE:0);
  const r = Math.max(0, Math.round(kHC/RACION_HC*4)/4);
  const incEnt = (()=>{ if(!esFitness()) return 0; const d=diasCliente().find(x=>x.id==="fuerza"); return d ? (d.aj[c]||0) : 0; })();
  const g1 = [...PROT1, ...(vegetal()?PROT1_VEG:[])].filter(o=>!prohibido(o.n)).map(o=>({g:redondo(prot/o.p*100), o})).filter(x=>x.g<=260 || x.o.p>=16).map(x=>({t:`${x.g} g de ${x.o.n}`}));
  // tortilla: huevos enteros y claras (hasta 4 huevos y 6 claras)
  const nh = Math.max(2,Math.min(4,Math.round(prot*0.55/6.5))), cl = Math.min(6,Math.max(0,Math.round((prot-nh*6.5)/3.6)));
  if(!prohibido("huevo")) g1.push({t:`tortilla de ${nh} huevos${cl?` + ${cl} claras`:""}`});
  const n2 = Math.max(2,Math.min(6,Math.round(prot*4.8/75)));   // cada opción del grupo 2 ≈ 75 kcal
  return {c, T, prot:Math.round(prot), protPedida:Math.round(protPedida), r, incEnt, cenaSinHC,
    hc: r ? hcLista().map(h=>hcLinea(h,r)) : [], hcEnt: incEnt>0 ? hcLista().slice(0,1).map(h=>hcLinea(h,r+incEnt))[0] : "",
    verd: FICHA.objetivo==="superavit" ? "Mínimo 50–100 g de verduras (crudas, hervidas, al vapor, al horno o en airfryer) para tener vitaminas y minerales. Ojo con la saciedad: no te pases de volumen, que lo importante es que te comas todos los hidratos y toda la proteína."
      : enDeficit() ? "200–300 g de verduras a peso: crudas, hervidas, al vapor, al horno o en airfryer. Nunca fritas ni salteadas con aceite. La verdura es clave para la saciedad."
      : "150–250 g de verduras a peso: crudas, hervidas, al vapor, al horno o en airfryer. Nunca fritas ni salteadas con aceite.",
    g1, n2, g2: [...PROT2, ...(vegetal()?PROT2_VEG:[])].map(o=>enDeficit()&&o.l?o.l:o.n).filter(n=>!prohibido(n)),
    extras: EXTRAS.filter(x=>!prohibido(x)), nExtra, extraEnt: esFitness(),
    postre: conPostre ? [...new Set(postres().filter(x=>!prohibido(x)).map(adaptarTexto))] : null};
}

/* =========== RECETAS ESPECIALES (Excel de recetas) ===========
   Para un día especial: fotos, cantidades recalculadas a las kcal de su comida o cena y paso a paso. */
const ESP = () => window.RECETAS_ESP || [];
const espKcal = r => r.ing.reduce((a,[n,g,k])=>a+(g*k/100),0);
const espNombre = n => n.replace(/\s*\((?=[^)]*\d)[^)]*\)/g,"").replace(/\s+/g," ").trim();
const espOk = r => !prohibido(r.t) && !r.ing.some(([n,g])=>g>0 && prohibido(n));
function espEscalar(r,T){
  const base=espKcal(r), f=Math.min(3,Math.max(0.4,T/base));
  const L=r.ing.map(([n,g,k,nota])=>{ const nm=espNombre(n), nt=nota&&!/\d/.test(nota)&&nota.length>2&&!/^no$/i.test(nota)?` (${nota.toLowerCase()})`:"";
    if(!g) return {t:/^\d/.test(nm)?nm:`${nm}${nt?nt:" al gusto"}`, k:0};
    const q=Math.max(1,redondo(g*f));
    const hv=/huevo/i.test(n)&&!/clara/i.test(n) ? ` (≈${Math.max(1,Math.round(q/60))} ${Math.max(1,Math.round(q/60))===1?"huevo":"huevos"})` : "";
    const nmx=/^AOVE$/i.test(nm)?"aceite de oliva virgen extra":(/^[A-ZÁÉÍÓÚÑ][a-záéíóúñü]/.test(nm)?nm.charAt(0).toLowerCase()+nm.slice(1):nm);
    return {t:`${q} g de ${nmx}${hv}${nt}`, k:q*k/100}; });
  return {L, kcal:Math.round(L.reduce((a,x)=>a+x.k,0))};
}
function espMes(T, n=5){
  const now=new Date(), seed=`${now.getFullYear()}-${now.getMonth()}-${FICHA.codigo||""}`;
  let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{ h^=h<<13; h>>>=0; h^=h>>17; h^=h<<5; h>>>=0; return h/4294967296; };
  const L=ESP().filter(r=>r.tipo==="principal" && espOk(r)).map(r=>({r, s:rnd()})).sort((a,b)=>a.s-b.s).map(x=>x.r);
  return L.slice(0,n);
}

/* =========== GOOGLE DRIVE DEL NUTRICIONISTA ===========
   Cada cliente tiene su carpeta (nombre y apellidos) dentro de «MOGAS · Clientes»:
   la dieta en Word, la dieta en Google Docs (editable), la dieta en PDF y el resumen de la entrevista.
   Permiso «drive.file»: la app solo ve las carpetas y archivos que crea ella. */
const GDRIVE = { clientId: "", raiz: "MOGAS · Clientes" };   // clientId: ID de cliente OAuth de Google Cloud (no es secreto)
const gOn = () => !!GDRIVE.clientId;
let GTOKEN=null, GEXP=0, GTC=null;
function gLoad(){ return new Promise((res,rej)=>{ if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  const sc=document.createElement("script"); sc.src="https://accounts.google.com/gsi/client"; sc.onload=()=>res(); sc.onerror=()=>rej(new Error("No se ha podido cargar Google")); document.head.appendChild(sc); }); }
function gToken(interactivo=true){
  if(GTOKEN && Date.now()<GEXP-60000) return Promise.resolve(GTOKEN);
  return gLoad().then(()=>new Promise((res,rej)=>{
    GTC=google.accounts.oauth2.initTokenClient({client_id:GDRIVE.clientId, scope:"https://www.googleapis.com/auth/drive.file", prompt:store.get("mogas-gdrive-ok")?"":"consent",
      callback:r=>{ if(r.error) return rej(new Error(r.error)); GTOKEN=r.access_token; GEXP=Date.now()+r.expires_in*1000; store.set("mogas-gdrive-ok",1); res(GTOKEN); },
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"Has cerrado la ventana de Google":"No se ha podido conectar con Google")) });
    GTC.requestAccessToken(); }));
}
async function gApi(url,{method="GET",body,headers={},raw}={}){
  const t=await gToken(); const r=await fetch(url.startsWith("http")?url:"https://www.googleapis.com/drive/v3/"+url,{method,body,headers:{Authorization:"Bearer "+t,...headers}});
  if(!r.ok){ const tx=await r.text(); throw new Error(`Google Drive ${r.status}: ${tx.slice(0,160)}`); }
  return raw ? r : (r.status===204 ? null : r.json());
}
const gq = s => String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function gBuscar(nombre,padre,mime){ const q=`name='${gq(nombre)}' and '${padre}' in parents and trashed=false`+(mime?` and mimeType='${mime}'`:"");
  const j=await gApi("files?q="+encodeURIComponent(q)+"&fields=files(id,name,webViewLink)"); return (j.files||[])[0]||null; }
async function gCarpeta(nombre,padre){ const f=await gBuscar(nombre,padre,"application/vnd.google-apps.folder"); if(f) return f;
  return gApi("files?fields=id,name,webViewLink",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:nombre,mimeType:"application/vnd.google-apps.folder",parents:[padre]})}); }
async function gRaiz(){
  const id=store.get("mogas-gdrive-raiz");

  const f=await gCarpeta(GDRIVE.raiz,"root"); store.set("mogas-gdrive-raiz",f.id); return f;
}
/* sube (o sustituye) un archivo; destino = tipo de Google al que convertir (p. ej. Google Docs) */
async function gSubir(nombre,padre,blob,mime,destino){
  const ya=await gBuscar(nombre,padre); if(ya) await gApi(`files/${ya.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})});
  const fd=new FormData(); fd.append("metadata",new Blob([JSON.stringify({name:nombre,mimeType:destino||mime,parents:[padre]})],{type:"application/json"})); fd.append("file",new Blob([blob],{type:mime}));
  return gApi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",{method:"POST",body:fd});
}

async function guardarEnDrive(out){
  const nombre=(FICHA.nombre||FICHA.codigo).trim(), say=t=>{ if(out) out.innerHTML=`<p class="note">${t}</p>`; };
  say("📁 Conectando con Google Drive…"); await gToken();
  const raiz=await gRaiz(); say("📁 Creando la carpeta del cliente…");
  const dir=await gCarpeta(nombre,raiz.id);
  const titulo=dietaParaDoc().titulo, base=`Dieta ${nombre}`;
  say("📄 Generando la dieta…"); const bytes=await docxBytes();
  await gSubir(`${base}.docx`,dir.id,bytes,DOCX_MIME);
  const gdoc=await gSubir(`${base} (editable)`,dir.id,bytes,DOCX_MIME,"application/vnd.google-apps.document");
  say("📄 Creando el PDF…"); const pdf=await (await gApi(`files/${gdoc.id}/export?mimeType=application/pdf`,{raw:true})).blob();
  await gSubir(`${base}.pdf`,dir.id,pdf,"application/pdf");
  say("📝 Creando el resumen de la entrevista…");
  await gSubir(`Resumen de la entrevista ${nombre}`,dir.id,new Blob([resumenEntrevistaHTML()],{type:"text/html"}),"text/html","application/vnd.google-apps.document");
  const all=misClientes(); if(all[FICHA.codigo]){ all[FICHA.codigo].drive={id:dir.id,url:dir.webViewLink,fecha:new Date().toISOString().slice(0,10)}; store.set("mogas-panel-clientes",all); }
  if(out) out.innerHTML=`<p class="ok">✅ Guardado en Google Drive: carpeta «${esc(nombre)}» con la dieta en Word, editable y PDF, y el resumen de la entrevista.</p><a class="doclink" href="${esc(dir.webViewLink)}" target="_blank" rel="noopener">📁 Abrir la carpeta de ${esc(nombre)}</a>`;
  return dir;
}

function resumenMes(y,m){ // m: 0-11
  const D=bebDatos(), pre=`${y}-${String(m+1).padStart(2,"0")}-`;
  const tot={}, dias=Object.keys(D).filter(k=>k.startsWith(pre)).sort();
  let k=0,n=0,alc=0,zero=0,otraN=0,otraK=0;
  dias.forEach(f=>{ const d=D[f]; Object.entries(d).forEach(([id,c])=>{ if(!BEB[id]) return; tot[id]=(tot[id]||0)+c; n+=c; k+=BEB[id].k*c; if(ALCOHOL.has(id)) alc+=c; if(BEB[id].k===0) zero+=c; });
    otraN+=+d._otra_n||0; otraK+=+d._otra_k||0; });
  n+=otraN; k+=otraK;
  const diasCon=dias.filter(f=>nDia(D[f])-(Object.entries(D[f]).filter(([id])=>BEB[id]&&BEB[id].k===0).reduce((a,[,c])=>a+c,0))>0).length;
  return {tot,k,n,alc,zero,otraN,otraK,diasCon,diasReg:dias.length};
}
function bebidasResumen(y,m){
  const now=new Date(); if(y==null){ y=now.getFullYear(); m=now.getMonth(); }
  const R=resumenMes(y,m), nombreMes=new Date(y,m,1).toLocaleDateString(locale(),{month:"long",year:"numeric"});
  const esActual = y===now.getFullYear() && m===now.getMonth();
  const diasMes = esActual ? now.getDate() : new Date(y,m+1,0).getDate();
  const semanal = Math.round(R.k/diasMes*7/10)*10;
  const filas = BEBIDAS.flatMap(g=>g.items).filter(i=>R.tot[i.id]).map(i=>`<div><span>${esc(i.t)} <small>× ${R.tot[i.id]}</small></span><b>${i.k*R.tot[i.id]} kcal</b></div>`).join("")
    + (R.otraN?`<div><span>Otras bebidas <small>× ${R.otraN}</small></span><b>${R.otraK} kcal</b></div>`:"");
  const def = FICHA.objetivo==="deficit" && FICHA.ajuste>0 ? FICHA.ajuste : 0;
  bot(`<b>📊 Tus bebidas · <span>${esc(nombreMes)}</span></b>
${R.n?`<div class="plate">${filas}<div class="tot"><span>Total</span><b>${R.k} kcal</b></div></div>
<ul><li><b>${R.n}</b> bebidas apuntadas, <b>${R.alc}</b> con alcohol y <b>${R.zero}</b> zero.</li>
<li>Has bebido algo con calorías <b>${R.diasCon}</b> días.</li>
${diasMes>=7?`<li>De media, unas <b>${semanal} kcal</b> a la semana en bebidas.</li>`:""}
${def&&R.k?`<li>Equivale a unos <b>${(R.k/def).toLocaleString(locale(),{maximumFractionDigits:1})}</b> días de tu déficit (${def} kcal/día).</li>`:""}</ul>`
:`<span class="note">Aún no hay bebidas apuntadas este mes.</span>`}
<span class="note">Enséñale este resumen a tu nutricionista en la visita de control.</span>`);
  const prev=new Date(y,m-1,1), next=new Date(y,m+1,1);
  opts([{t:"🍹 Apuntar una bebida", f:()=>bebidasApuntar()},
    ...(R.n?[{t:"📤 Enviar el resumen a mi nutricionista", f:()=>bebidasEnviar(y,m)}]:[]),
    {t:"⬅️ Mes anterior", f:()=>bebidasResumen(prev.getFullYear(),prev.getMonth())},
    ...(!esActual?[{t:"➡️ Mes siguiente", f:()=>bebidasResumen(next.getFullYear(),next.getMonth())}]:[])]);
}
async function bebidasEnviar(y,m){
  const R=resumenMes(y,m), nombreMes=new Date(y,m,1).toLocaleDateString(locale(),{month:"long",year:"numeric"});
  const L = BEBIDAS.flatMap(g=>g.items).filter(i=>R.tot[i.id]).map(i=>`• ${trT(i.t)}: ${R.tot[i.id]} (${i.k*R.tot[i.id]} kcal)`);

/* =========== CONTADOR DE PASOS ===========

const pasKey = () => "mogas-pasos-" + (FICHA.codigo||"DEMO");
const pasDatos = () => { const v=store.get(pasKey())||{}; return {d:v.d||{}, w:v.w||{}}; };
const pasGuardar = v => store.set(pasKey(), v);
const deISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const lunesDe = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const sumarDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtN = n => Math.round(n).toLocaleString(locale());
const fmtDia = (d,o) => d.toLocaleDateString(locale(), o||{weekday:"short", day:"numeric"});
const rango = lun => `${fmtDia(lun,{day:"numeric",month:"short"})} – ${fmtDia(sumarDias(lun,6),{day:"numeric",month:"short"})}`;
function semana(lun){ // media de la semana: la media apuntada manda; si no, la de los días apuntados
  const P=pasDatos(), k=fechaISO(lun), dias=[...Array(7)].map((_,i)=>{const f=fechaISO(sumarDias(lun,i)); return P.d[f];});
  const ld=dias.slice(0,5).filter(v=>v!=null), td=dias.filter(v=>v!=null);
  if(P.w[k]!=null) return {media:P.w[k], fuente:"semana", dias, n:td.length};
  if(!td.length) return {media:null, dias, n:0};
  const media = ld.length ? ld.reduce((a,b)=>a+b,0)/ld.length : td.reduce((a,b)=>a+b,0)/td.length;
  return {media, fuente: ld.length?"lv":"todos", dias, n:td.length};
}
const marca = m => m==null?"":(FICHA.pasosObjetivo && m>=FICHA.pasosObjetivo ? "✅" : "⚠️");

/* condicional de pasos: si un día camina 3.000 pasos más o menos que su media, se ajustan los hidratos */
function ajustePasosHTML(v){

/* --- Ver dieta --- */
function verDieta(){
  const R=reparto(), kc=kcalObj(), {pre,post}=prePost();
  const cs=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b]);
  bot(`Tu objetivo es de <b>${kc} kcal</b> al día, repartidas así:<div class="plate">${cs.map(c=>`<div><span>${esc(c)}${c===pre?" · antes de entrenar":c===post?" · después de entrenar":""}${franja(c)?`<small class="frj">🕐 ${franja(c)}</small>`:""}</span><span><b>${Math.round(kcalMenus()*R[c]/1000)*10} kcal</b> (${R[c]}%)</span></div>`).join("")}${batidoBase()?`<div><span>🥤 Batido post-entreno<small class="frj">${esc(batidoTxt())}</small></span><span><b>${batidoBase()} kcal</b></span></div>`:""}</div>${FICHA.entreno==="ayunas"?`<span class="note">Entrenas en ayunas: si tienes mucha hambre, como máximo 1 pieza de fruta al levantarte.</span>\n`:pre?`<span class="note">Deja al menos 2 horas entre ${esc(pre.toLowerCase())} y el entreno.</span>\n`:""}¿Qué comida quieres ver?`);
  opts([...(conTiposDia()?[{t:"📅 ¿Qué día es hoy? (ajusta tu dieta)", f:tipoDiaHoy}]:[]), ...COMIDAS.filter(c=>!COMIDA_DE[c.id] || FICHA.comidas.includes(COMIDA_DE[c.id]) || c.id==="precama").map(c=>({t:c.nombre+(franja(COMIDA_DE[c.id])?` · ${franja(COMIDA_DE[c.id])}`:""), f:()=>verComida(c)}))]);
}
const COMIDA_DE = {desayuno:"Desayuno", segundo:"Segundo desayuno", comida:"Comida", merienda:"Merienda", cena:"Cena", precama:"Pre-cama"};
/* --- Tipo de día (fitness / resistencia): el cliente elige qué día es y ve su dieta ajustada --- */
function tipoDiaHoy(){
  const D=diasCliente(); if(!D.length){ verDieta(); return; }
  bot("¿Qué día es hoy?");
  opts(D.map(d=>({t:d.n, f:()=>verTipoDia(d)})));
}
function verTipoDia(d){
  const kc=kcalObj(), R=reparto(), cs=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b]), ex=extraDia(d);
  const kN=c=>Math.round(kcalMenus()*R[c]/1000)*10;

  cs.filter(c=>d.aj[c]).forEach(c=>{ const r=d.aj[c], a=Math.abs(r);
    h+=`<div class="plate"><div><span>${esc(c)}</span><span><b>${r>0?"+":"−"}${fr(a)} ${a>1?"raciones":"ración"} de hidratos</b></span></div></div><span class="note">${r>0?"Añade, por ejemplo:":"Quita, por ejemplo:"}</span><ul>${ejemplosComida(c,a).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`; });
  if(d.batido) h+=`<div class="plate"><div><span>🥤 Batido post-entreno</span><span><b>${esc(batidoTxt())}</b> (≈${kcalBatido()} kcal)</span></div></div><span class="note">Tómalo al acabar de entrenar.</span>`;
  if(!Object.keys(d.aj).length && !d.batido) h+=`<span class="note">Hoy sigue tu dieta tal cual.</span>`;
  else h+=`<span class="note">La proteína y las verduras no cambian. Cualquier hidrato de tu tabla vale: mismas raciones, el que prefieras.</span>`;
  bot(h);
  opts([...cs.filter(c=>d.aj[c]).map(c=>{ const r=d.aj[c], a=Math.abs(r); return {t:`📊 Todas las opciones: ${r>0?"+":"−"}${fr(a)} en ${c.toLowerCase()}`, f:()=>tablaHC(a,`${r>0?"Añade":"Quita"} en ${c.toLowerCase()}: ${r>0?"+":"−"}${fr(a)} ${a>1?"raciones":"ración"} de hidratos`)}; }),
    {t:"📅 Otro tipo de día", f:tipoDiaHoy}]);
}
function verComida(c){
  const cm=COMIDA_DE[c.id], kReal = cm && FICHA.comidas.includes(cm) ? kcalComida(cm) : c.kcal;
  let h=`<b>${esc(c.nombre)}</b>${franja(cm)?` · 🕐 ${franja(cm)}`:""} · ≈${kReal} kcal`;
  if((cm==="Comida"||cm==="Cena") && FICHA.platoAuto && FICHA.peso>0){ const P=platoPrincipal(cm); if(P){ bot(h+"\n"+platoHTML(P)); opts([{t:"🍽️ Montarla paso a paso", f:montarInicio},{t:"📋 Ver otra comida", f:verDieta}]); return; } }
  const rec = COMIDAS_RECETA.includes(cm) ? recetasComidaHTML(cm) : "";
  if(rec){ bot(h+"\n"+rec); opts([{t:"📋 Ver otra comida", f:verDieta}]); return; }
  if(c.texto) h+=`\n${esc(c.texto)}`;
  (c.grupos||[]).forEach(g=>{const G=GRUPOS[g];h+=`\n<span class="note">${esc(G.nota)}</span><ul>${G.opciones.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`});
  bot(h);
  const extra = (c.id==="comida"||c.id==="cena") ? [{t:"🍽️ Montarla paso a paso", f:montarInicio}] : [];
  opts([...extra, {t:"📋 Ver otra comida", f:verDieta}]);
}

/* --- Montar comida/cena --- */
function montarInicio(){
  bot("¿Qué te apetece hoy?");
  opts([
    {t:"🥗 Ensalada completa", f:()=>montar("ensalada")},
    {t:"🔥 Plato caliente", f:()=>montar("caliente")}
  ]);
}
function montar(tipo){
  const E=ESTRUCTURA[tipo]; const sel={}; let i=0;
  const paso=()=>{
    if(i>=E.pasos.length) return resumen();
    const key=E.pasos[i], G=GRUPOS[key], n=G.elegir||1;
    sel[key]=sel[key]||[];
    const falta=n-sel[key].length;
    bot(`<b>${esc(G.nombre)}</b>${n>1?` (${sel[key].length+1} de ${n})`:""}\n<span class="note">${esc(G.nota)}</span>`);
    opts(G.opciones.map(o=>({t:o, f:()=>{sel[key].push(o); if(sel[key].length>=n) i++; paso();}})));
  };
  const resumen=()=>{
    let h=`✅ <b>Tu ${E.titulo.toLowerCase()}</b> (≈600 kcal)<div class="plate">`;
    E.pasos.forEach(k=>{h+=`<div><span>${esc(GRUPOS[k].nombre.split(" (")[0])}</span><span>${sel[k].map(esc).join("<br>")}</span></div>`});
    h+=`</div><span class="note">${esc(E.fijo)}</span>\n<span class="warn">⚠️ Ojo con el aceite: solo esos 5 g, pesados. Verduras sin freír ni saltear.</span>`;
    bot(h);
    opts([{t:"🔁 Montar otra", f:montarInicio}]);
  };
  paso();
}

/* --- Cambiar alimento (equivalencias) --- */
function cambiar(){
  bot("¿Qué tipo de alimento quieres cambiar?");
  opts([
    {t:"🍚 Hidrato (arroz, quinoa, pan…)", f:()=>equiv("hc")},
    {t:"📊 Tabla de hidratos crudo/cocido", f:()=>tablaHC(1)},
    {t:"🍗 Proteína de plato caliente", f:()=>equiv("protCaliente")},
    {t:"🥚 Proteína de ensalada", f:()=>equiv("protEnsalada")},
    {t:"🥦 Verdura", f:()=>{bot(`<b>Las verduras no tienen equivalencias: cualquiera vale.</b>\nUna sola o mezcladas, lo que cuenta es el <b>peso: 200–300 g</b> en comida y cena.\n✅ Crudas, hervidas, al vapor, al horno o en airfryer.\n❌ Nunca fritas ni salteadas en aceite.`);opts([{t:"🔄 Cambiar otro alimento", f:cambiar}])}},
    {t:"🥑 Grasa o extra", f:()=>equiv("grasa")},
    {t:"🍎 Fruta", f:()=>equiv("fruta")},
    {t:"🍞 Desayuno", f:()=>equiv("desayuno")}
  ]);
}
/* cantidad de un hidrato para r raciones (r puede ser 0,5 · 1 · 1,5 …) */
function hcCant(h,r){
  const ud=x=>x===0.5?"½":x===1.5?"1½":fr(x);
  if(h.n.startsWith("Tortilla")) return `${ud(r)} ud (${g5(45*r)} g)`;
  if(h.fijo) return `${g5(parseInt(h.fijo)*r)} g`;
  if(!h.cocido) return `${g5(h.crudo*r)} g`;
  return `${g5(h.crudo*r)} g crudo · <b>${g5(h.cocido*r)} g cocido</b>`;
}
function tablaHC(r=1, titulo){
  const kc=Math.round(r*RACION_HC);
  const cab = titulo || (r===1 ? "1 ración de hidratos ≈ 145 kcal" : `${fr(r)} ${r>1?"raciones":"ración"} de hidratos ≈ ${kc} kcal`);
  bot(`<b>${esc(cab)}</b>\n<span class="note">${!titulo?"Todas estas cantidades son equivalentes.":titulo.startsWith("Quita")?`Quita esta cantidad del hidrato que vayas a comer (≈${kc} kcal). Ya está calculado, no tienes que hacer cuentas.`:`Elige <b>una</b> de estas opciones (≈${kc} kcal). Ya está calculado, no tienes que hacer cuentas.`}</span><div class="plate">${HC.map(h=>`<div><span>${esc(h.n)}</span><span>${hcCant(h,r)}</span></div>`).join("")}</div><span class="note">Crudo = pesado en seco, antes de cocinar. Cocido = ya cocinado y escurrido, sin aceite.</span>`);
  opts([{t:"💡 Almidón resistente", f:()=>{bot(ALMIDON);opts([])}}, {t:"🔄 Cambiar otro alimento", f:cambiar}]);
}
function equiv(key){
  const G=GRUPOS[key];
  if(key==="hc"){
    bot(`¿Cuál tienes en el plan y quieres cambiar?`);
    opts(HC.map(h=>({t:h.n, f:()=>{
      bot(`<b>${esc(hcTxt(h))}</b> equivale a cualquiera de estas (≈145 kcal):<ul>${HC.filter(x=>x!==h).map(x=>`<li>${esc(hcTxt(x))}</li>`).join("")}</ul>${h.ra?`<span class="note">💡 Si lo cocinas y lo guardas en la nevera, ganas almidón resistente.</span>`:""}`);
      opts([{t:"💡 Almidón resistente", f:()=>{bot(ALMIDON);opts([])}}, {t:"🔄 Cambiar otro alimento", f:cambiar}]);
    }})));
    return;
  }
  bot(`¿Cuál tienes en el plan y quieres cambiar?`);
  opts(G.opciones.map(o=>({t:o, f:()=>{
    const otros=G.opciones.filter(x=>x!==o);
    bot(`Puedes cambiar <b>${esc(o)}</b> por cualquiera de estas, son equivalentes en tu dieta:<ul>${otros.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`);
    opts([{t:"🔄 Cambiar otro alimento", f:cambiar}]);
  }})));
}

  bot("¿Qué has hecho hoy? Puedes marcar varias cosas y luego pulsa <b>Calcular</b>.");
  const w=document.createElement("div");w.className="opts";
  const marcadas=new Set();
  INCREMENTOS.forEach(r=>{const b=document.createElement("button");b.className="tog";b.innerHTML=`${esc(r.nombre)}${r.def?`<small>${esc(r.def)}</small>`:""}`;

/* redondeo amable: el número más redondo (100, 50, 10, 5, 1) sin moverse más de un 5 % */
function redondo(x){ if(!(x>0)) return 0; for(const st of [100,50,10,5,1]){ const v=Math.round(x/st)*st; if(v>0 && Math.abs(v-x)<=0.05*x) return v; } return Math.round(x); }
const g5=x=>Math.max(5,redondo(x));
function ejemplosHC(r){
  const pick=["Arroz blanco o basmati","Pasta","Quinoa","Patata (hervida u horno)","Pan blanco"].map(n=>HC.find(h=>h.n===n));
  return pick.map(h=>h.fijo ? `${g5(55*r)} g de pan` : h.cocido ? `${g5(h.crudo*r)} g de ${h.n.split(" (")[0].toLowerCase()} en crudo (${g5(h.cocido*r)} g cocido)` : `${g5(h.crudo*r)} g de ${h.n.toLowerCase()}`);
}
const fr=x=>String(x).replace(".",",");
function ajusteDia(sel){
  if(!sel.length){
    bot(`Hoy <b>sigue tu dieta tal cual</b> (${kcalObj()} kcal), sin incrementos ni pre-cama.\nRecuerda: el objetivo es una media de 12.000 pasos de lunes a viernes. 🚶`);
    opts([]);return;
  }
  const porComida={}; let precama=false;
  sel.forEach(r=>{
    if(incPrecama(r)) precama=true;
    Object.entries(incAj(r)).forEach(([c,v])=>{ if(+v) porComida[c]=(porComida[c]||0)+(+v); });
  });
  if(precama && FICHA.comidas.includes("Pre-cama")) precama=false; // ya lo tiene cada día
  const totalR=Object.values(porComida).reduce((a,b)=>a+b,0);
  if(!totalR && !precama){bot(`Hoy <b>sigue tu dieta tal cual</b> (${kcalObj()} kcal): tu pre-cama ya está incluido cada día.`);opts([]);return;}
  const extra=Math.round(totalR*RACION_HC)+(precama?KCAL_PRECAMA:0);
  let h=`💪 <b>Tu ajuste de hoy</b> (+${extra} kcal → ${kcalObj()+extra} kcal en total)`;
  TODAS_COMIDAS.forEach(d=>{const r=porComida[d];if(!r)return;
    h+=`<div class="plate"><div><span>${esc(d)}</span><span><b>+${fr(r)} ${r>1?"raciones":"ración"} de hidratos</b> (≈${Math.round(r*RACION_HC)} kcal)</span></div></div><span class="note">Por ejemplo, añade:</span><ul>${ejemplosComida(d,r).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;});
  if(precama) h+=`<div class="plate"><div><span>Pre-cama</span><span><b>Hoy te toca</b> (≈${KCAL_PRECAMA} kcal)</span></div></div><ul>${GRUPOS.precama.opciones.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`;
  h+=`<span class="note">Cualquier hidrato de tu tabla vale: mismas raciones, el que prefieras.</span>`;
  bot(h);
  opts(TODAS_COMIDAS.filter(d=>porComida[d]).map(d=>{const r=porComida[d];return {t:`📊 Todas las opciones: +${fr(r)} en ${d.toLowerCase()}`, f:()=>tablaHC(r,`Añade en ${d.toLowerCase()}: +${fr(r)} ${r>1?"raciones":"ración"} de hidratos`)}}));
}

/* --- Cambio de horario de entreno (solo para hoy) --- */
function otraHora(){
  bot(`Normalmente entrenas: <b>${esc(ENTRENOS[FICHA.entreno].t.toLowerCase())}</b>.\n¿Cuándo entrenas hoy?`);
  opts(Object.keys(ENTRENOS).filter(k=>k!==FICHA.entreno).map(k=>({t:k==="no"?"😴 Hoy no entreno":ENTRENOS[k].t, f:()=>repartoHoy(k)})));
}
function ejemplosComida(comida, r){
  const dulce=["Desayuno","Segundo desayuno","Merienda","Pre-cama"].includes(comida);
  const nombres = dulce ? ["Pan blanco","Pan integral","Copos de avena"] : ["Arroz blanco o basmati","Pasta","Patata (hervida u horno)","Pan blanco"];
  return nombres.map(n=>HC.find(h=>h.n===n)).map(h=>{
    if(h.fijo) return `${g5(parseInt(h.fijo)*r)} g de ${h.n.toLowerCase()}`;
    if(!h.cocido) return `${g5(h.crudo*r)} g de ${h.n.toLowerCase()}`;
    return `${g5(h.crudo*r)} g de ${h.n.split(" (")[0].toLowerCase()} en crudo (${g5(h.cocido*r)} g cocido)`;
  });
}
function repartoHoy(ent){
  const kc=kcalObj(), base=reparto(), aN=repartoAuto(FICHA.entreno), aH=repartoAuto(ent);
  const cs=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b]);
  // reparto de hoy = el de siempre + la diferencia que provoca el nuevo horario
  const hoy={}; cs.forEach(c=>hoy[c]=Math.max(0,base[c]+(aH[c]-aN[c])));
  const kN=c=>Math.round(kc*base[c]/1000)*10, kH=c=>Math.round(kc*hoy[c]/1000)*10;
  const {pre,post}=prePost(ent);
  // cambios en raciones de hidratos (medias raciones)
  const cambios=cs.map(c=>({c, r:Math.round((kH(c)-kN(c))/RACION_HC*2)/2})).filter(x=>x.r!==0);
  // que lo que se quita y se pone cuadre
  const neto=cambios.reduce((a,x)=>a+x.r,0);
  if(neto!==0 && cambios.length){ const big=[...cambios].sort((a,b)=>Math.abs(b.r)-Math.abs(a.r))[0]; big.r-=neto; }
  const mov={}; cambios.forEach(x=>mov[x.c]=x.r);
  const kHoy=c=>kN(c)+Math.round((mov[c]||0)*RACION_HC/5)*5;
  let h=`⏰ <b>Tu reparto de hoy</b> (mismas ${kc} kcal, solo cambia dónde van los hidratos)<table class="cmp"><tr><th></th><th>Normal</th><th>Hoy</th></tr>${cs.map(c=>{const d=kHoy(c)-kN(c);return `<tr><td>${esc(c)}${c===pre?"<small>antes de entrenar</small>":c===post?"<small>después de entrenar</small>":""}</td><td>${kN(c)}</td><td class="${d>0?"up":d<0?"down":""}">${kHoy(c)}${d>0?" ▲":d<0?" ▼":""}</td></tr>`}).join("")}</table>`;
  const cf=cambios.filter(x=>x.r!==0);
  if(!cf.length) h+=`<span class="note">El cambio es tan pequeño que no hace falta mover nada: come como siempre.</span>`;
  cf.sort((a,b)=>POS[a.c]-POS[b.c]).forEach(x=>{
    const r=Math.abs(x.r);
    h+=`<div class="plate"><div><span>${esc(x.c)}</span><span><b>${x.r>0?"+":"−"}${fr(r)} ${r>1?"raciones":"ración"} de hidratos</b></span></div></div><span class="note">${x.r>0?"Añade, por ejemplo:":"Quita, por ejemplo:"}</span><ul>${ejemplosComida(x.c,r).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`;
  });
  if(ent==="ayunas") h+=`<span class="note">💡 Entrena en ayunas. Si tienes mucha hambre, como máximo 1 pieza de fruta al levantarte.</span>\n`;
  else if(pre) h+=`<span class="note">💡 Deja al menos 2 horas entre ${esc(pre.toLowerCase())} y el entreno.</span>\n`;
  h+=`<span class="note">La proteína y las verduras no cambian. Mañana vuelves a tu reparto normal.</span>`;
  bot(h);
  opts([...cf.map(x=>{const r=Math.abs(x.r),v=x.r>0?"Añade":"Quita";return {t:`📊 Todas las opciones: ${x.r>0?"+":"−"}${fr(r)} en ${x.c.toLowerCase()}`, f:()=>tablaHC(r,`${v} en ${x.c.toLowerCase()}: ${x.r>0?"+":"−"}${fr(r)} ${r>1?"raciones":"ración"} de hidratos`)}}),
    {t:"🏃 Además he hecho más actividad", f:actividad},{t:"⏰ Elegir otra hora", f:otraHora}]);
}

/* --- Comida saltada: recuperar sus calorías --- */
const KCAL_FRUTA = 100; // 1 pieza de fruta, como en la dieta
function saltada(){
  bot("Vaya, ¿qué comida te has saltado?");
  const cs=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b]);
  opts(cs.map(c=>({t:c, f:()=>saltadaComo(c)})));
}
function saltadaComo(c){
  const kc=kcalObj(), R=reparto(), falta=Math.round(kcalMenus()*R[c]/1000)*10;
  const cs=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b]);
  const quedan=cs.filter(x=>POS[x]>POS[c] && x!=="Pre-cama");
  if(c==="Pre-cama"){
    bot(`El pre-cama son solo ≈${falta} kcal. <b>No hace falta recuperarlo:</b> mañana sigue tu dieta con normalidad.`);opts([]);return;
  }
  let h=`Te faltan <b>≈${falta} kcal</b> de ${esc(c.toLowerCase())}. ¿Cómo prefieres recuperarlas?`;
  const o=[];
  const principal=["Comida","Cena"].includes(c);
  if(quedan.length>1) o.push({t:"🔀 Repartirlas en el resto del día", f:()=>recRepartir(c,falta,quedan,principal)});
  if(quedan.length) o.push({t:`➕ Añadirlas a ${quedan[0].toLowerCase()}${principal?"":" (más postre e hidratos)"}`, f:()=>recSiguiente(c,falta,quedan[0],principal)});
  if(principal && !quedan.length) o.push({t:"🍽️ Hacer una cena ligera ahora", f:()=>recLigera(c,falta)});
  if(falta<=400) o.push({t:"🌙 Hacer un pre-cama con ellas", f:()=>recPrecama(falta)});
  if(falta<=400) o.push({t:"🤷 No la recupero hoy", f:()=>recManana(c,falta)});
  if(!quedan.length) h+=`\n<span class="note">Ya no te quedan comidas hoy.</span>`;
  bot(h); opts(o);
}
const half=x=>Math.round(x*2)/2;
function bloqueHC(comida,r){
  return `<div class="plate"><div><span>${esc(comida)}</span><span><b>+${fr(r)} ${r>1?"raciones":"ración"} de hidratos</b> (≈${Math.round(r*RACION_HC)} kcal)</span></div></div><span class="note">Por ejemplo, añade:</span><ul>${ejemplosComida(comida,r).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`;
}
function botonesHC(lista){ // lista de [comida, raciones]
  return lista.filter(x=>x[1]>0).map(([c,r])=>({t:`📊 Todas las opciones: +${fr(r)} en ${c.toLowerCase()}`, f:()=>tablaHC(r,`Añade en ${c.toLowerCase()}: +${fr(r)} ${r>1?"raciones":"ración"} de hidratos`)}));
}
const KCAL_PROT=225; // 3 opciones de proteína del Grupo 2
function bloqueProt(comida){
  return `<div class="plate"><div><span>${esc(comida)}</span><span><b>+3 opciones de proteína</b> (≈${KCAL_PROT} kcal)</span></div></div><span class="note">Elige 3 (puedes repetir):</span><ul>${GRUPOS.protEnsalada.opciones.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`;
}
function recLigera(c,falta){
  const r=half(Math.max(0,falta-KCAL_PROT-KCAL_FRUTA)/RACION_HC);
  let h=`🍽️ <b>Cena ligera</b> para cubrir las ≈${falta} kcal de ${esc(c.toLowerCase())} (tipo ensalada o poke, rápida de preparar):`;
  h+=bloqueProt("Proteína");
  if(r>0) h+=bloqueHC("Cena",r);
  h+=`<span class="note">+ verduras a voluntad (200–300 g) y 1 pieza de fruta de postre.</span>`;
  bot(h); opts(botonesHC([["Cena",r]]));
}
function recRepartir(c,falta,quedan,principal){
  if(principal){ // la proteína va a la siguiente comida principal (o a la siguiente que haya)
    const dest=quedan.find(x=>x==="Comida"||x==="Cena")||quedan[0];
    return recRepartirHC(c,falta-KCAL_PROT,quedan,`🔀 <b>Repartimos las ≈${falta} kcal de ${esc(c.toLowerCase())}</b> en lo que te queda de día:`,bloqueProt(dest));
  }
  return recRepartirHC(c,falta,quedan,`🔀 <b>Repartimos las ≈${falta} kcal de ${esc(c.toLowerCase())}</b> en lo que te queda de día:`,"");
}
function recRepartirHC(c,falta,quedan,cab,extra){
  const R=reparto(), tot=quedan.reduce((a,x)=>a+R[x],0);
  const lista=quedan.map(x=>[x, half(falta*R[x]/tot/RACION_HC)]);
  // que el total de raciones cuadre con lo que falta
  const objetivo=half(falta/RACION_HC), suma=lista.reduce((a,x)=>a+x[1],0);
  if(suma!==objetivo){const big=lista.reduce((a,b)=>R[b[0]]>R[a[0]]?b:a); big[1]=Math.max(0,big[1]+(objetivo-suma));}
  let h=cab;
  lista.filter(x=>x[1]>0).forEach(([x,r])=>h+=bloqueHC(x,r));
  h+=extra;
  if(!lista.some(x=>x[1]>0) && !extra) h+=`\n<span class="note">Es tan poco que no hace falta cambiar nada: sigue tu dieta.</span>`;
  h+=`<span class="note">Las verduras de cada comida no cambian.</span>`;
  bot(h); opts(botonesHC(lista));
}
function recSiguiente(c,falta,sig,principal){
  const pre = principal ? bloqueProt(sig) : "";
  if(principal) falta -= KCAL_PROT;
  const nF = falta<=2*KCAL_FRUTA ? Math.max(1,Math.round(falta/KCAL_FRUTA)) : 1;
  const r = half(Math.max(0,falta-nF*KCAL_FRUTA)/RACION_HC);
  let h=`➕ <b>Añade a ${esc(sig.toLowerCase())}</b> las kcal de ${esc(c.toLowerCase())}:`+pre;
  h+=`<div class="plate"><div><span>Postre</span><span><b>+${nF} pieza${nF>1?"s":""} de fruta</b> (≈${nF*KCAL_FRUTA} kcal)</span></div></div><span class="note">1 pieza de fruta =</span><ul>${GRUPOS.fruta.opciones.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`;
  if(r>0) h+=bloqueHC(sig,r);
  bot(h); opts(botonesHC([[sig,r]]));
}
function recManana(c,falta){
  const primera=[...FICHA.comidas].sort((a,b)=>POS[a]-POS[b])[0];
  const r = falta<=200 ? 0.5 : 1;
  let h=`👍 <b>Vale, hoy no la recuperas.</b> No pasa nada con ≈${falta} kcal.\n<b>Mañana</b>, sube un poco los hidratos ${primera==="Desayuno"?"del desayuno":"de "+esc(primera.toLowerCase())}:`;
  h+=bloqueHC(primera,r).replace("Por ejemplo, añade:","Mañana, añade por ejemplo:");
  h+=`<span class="note">Solo mañana; pasado mañana vuelves a tu dieta normal.</span>`;
  bot(h); opts(botonesHC([[primera,r]]));
}
function recPrecama(falta){
  let h;
  if(falta>=200){
    const n=Math.min(2,Math.max(1,Math.round(falta/KCAL_PRECAMA)));
    h=`🌙 <b>Hoy haz ${n>1?"un pre-cama doble":"un pre-cama"}</b> (≈${n*KCAL_PRECAMA} kcal) antes de dormir. Elige ${n>1?"dos opciones (o la misma dos veces)":"una opción"}:<ul>${GRUPOS.precama.opciones.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`;
    const resto=falta-n*KCAL_PRECAMA;
    if(resto>=KCAL_FRUTA*0.75) h+=`<span class="note">Y añade 1 pieza de fruta para completar.</span>`;
  } else {
    const nF=Math.max(1,Math.round(falta/KCAL_FRUTA));
    h=`🌙 <b>Antes de dormir, toma ${nF} pieza${nF>1?"s":""} de fruta</b> (≈${nF*KCAL_FRUTA} kcal):<ul>${GRUPOS.fruta.opciones.map(o=>`<li>${esc(o)}</li>`).join("")}</ul><span class="note">O 1 yogur vegetal con la fruta dentro.</span>`;
  }
  bot(h); opts([]);
}

/* --- Tirada larga o carrera --- */
const EVENTO = { cenaLarga:0.5, cenaCarrera:1, desayunoCarreraExtra:1 }; // raciones de hidratos (editable por el nutricionista)
const PROT_MAGRA = ["Pechuga de pollo o de pavo","Pescado blanco (merluza, bacalao, lenguado…)","Huevo o claras","Sepia o calamar a la plancha"];

function evento(){

function eventoCuando(tipo){

function desayunoEvento(tipo){
  const R=reparto(), kc=kcalObj();

  const total = base + (tipo==="carrera" ? EVENTO.desayunoCarreraExtra*RACION_HC : 0);
  const prot=75, bebida=90; // 20 g proteína en polvo / 200 ml bebida de avena
  const cereal=g5((total-prot-bebida)/375*100), pan=g5((total-prot)/265*100);

<span class="note">Si puedes, levántate 3 h antes de empezar para desayunar con tiempo. Alto en hidratos, sin fibra y sin grasa, para que se digiera fácil. <b>Nada integral.</b></span><div class="plate"><div><span>Opción A</span><span>${cereal} g de cereales no integrales + 200 ml de bebida de avena + 20 g de proteína en polvo</span></div><div><span>Opción B</span><span>${pan} g de pan blanco + 75 g de pavo <i>o</i> 100 g de queso fresco desnatado</span></div></div><span class="note">Si no puedes levantarte 3 h antes, toma algo más pequeño y fácil (1 plátano o 1 tostada de pan blanco con mermelada) al menos 1 h antes.</span>`;
}
function eventoManana(tipo){

  h+=`<span class="note">Por ejemplo, añade:</span><ul>${ejemplosComida("Cena",r).filter(e=>!e.includes("integral")).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`;
  h+=`<b>2. Mañana</b>\n`+desayunoEvento(tipo);

}
function eventoHoy(tipo,cuando){
  let h=`🏁 <b>${tipo==="carrera"?"Carrera":"Tirada larga"} hoy por la ${cuando==="manana"?"mañana":"tarde"}</b>\n`;
  if(cuando==="manana") h+=desayunoEvento(tipo);
  else h+=`<b>Comida previa, 3 horas antes</b>\n<span class="note">Alta en hidratos y fácil de digerir:</span><div class="plate"><div><span>Hidratos</span><span>los de tu comida${tipo==="carrera"?` <b>+${fr(EVENTO.cenaCarrera)} ración</b>`:""}: ${HC_BLANCO.join(", ").toLowerCase()}</span></div><div><span>Proteína</span><span>magra: ${PROT_MAGRA.join(", ").toLowerCase()}</span></div><div><span>Verduras</span><span>pocas y bien cocinadas</span></div><div><span>Evita</span><span>integrales, legumbres, fritos y grasa extra</span></div></div>`;

  // si es por la tarde, la comida ya ha pasado: todo el incremento va a la cena
  // si es por la tarde, lo de las comidas que ya han pasado va a la cena
  const inc = larga && cuando==="tarde" ? (()=>{ const a={...incAj(larga)}, ya=["Desayuno","Segundo desayuno","Comida"]; let m=0; ya.forEach(c=>{ if(a[c]){ m+=a[c]; delete a[c]; } }); if(m) a.Cena=(a.Cena||0)+m; return {...larga, aj:a}; })() : larga;
  opts([{t:"🥤 Qué tomar durante el entreno", f:intraInicio}, ...(inc?[{t:"🍽️ Ver mi ajuste después de la tirada", f:()=>ajusteDia([inc])}]:[])]);
}

/* --- Intraentreno: hidratos durante entrenos largos --- */
const KCAL_HORA = {correr:650, bici:500, otro:550}; // estimación si no hay dato del reloj
const TOMA_G = 25; // 1 toma ≈ 25 g de hidratos
const TOMAS = ["1 gel energético","1 plátano mediano","40 g de dulce de membrillo o de guayaba","1 barrita energética","1½ dátiles Medjool (o 4 dátiles normales)","500 ml de bebida isotónica (≈30 g)","30 g de pasas"];
function intraInicio(){
  bot("Vamos a calcular qué tomar <b>durante</b> el entreno. ¿Qué deporte?");
  opts([{t:"🏃 Correr",f:()=>intraMedida("correr")},{t:"🚴 Bici",f:()=>intraMedida("bici")},{t:"🏊 Otro",f:()=>intraMedida("otro")}]);
}
function intraMedida(dep){
  bot("¿Cómo prefieres decírmelo?");
  opts([{t:"⏱️ Por horas",f:()=>intraHoras(dep)},{t:"🔥 Por kcal (las del reloj)",f:()=>intraKcal(dep)}]);
}
function intraHoras(dep){
  bot("¿Cuánto va a durar?");
  opts([1,1.5,2,2.5,3,3.5,4,5,6].map(h=>({t:`${fr(h)} h`,f:()=>intraPrio(dep,h,null)})));
}
function intraKcal(dep){
  bot("¿Cuántas kcal vas a gastar (aprox.)? Y luego te pregunto la duración.");
  opts([600,800,1000,1200,1500,2000,2500,3000].map(k=>({t:`${k} kcal`,f:()=>{
    bot("¿Y cuánto durará, más o menos?");
    opts([1,1.5,2,2.5,3,3.5,4,5,6].map(h=>({t:`${fr(h)} h`,f:()=>intraPrio(dep,h,k)})));
  }})));
}
function intraPrio(dep,h,k){
  const def=FICHA.prioridad;
  bot(`¿Qué priorizas hoy?\n<span class="note">Tu nutricionista ha marcado por defecto: <b>${def==="grasa"?"perder grasa":"rendimiento"}</b>.</span>`);
  opts([{t:`🔥 Perder grasa${def==="grasa"?" (recomendado)":""}`,f:()=>intraPlan(dep,h,k,"grasa")},{t:`⚡ Rendimiento${def==="rendimiento"?" (recomendado)":""}`,f:()=>intraPlan(dep,h,k,"rendimiento")}]);
}
function intraPlan(dep,h,k,prio){
  const gasto = k || Math.round(KCAL_HORA[dep]*h/50)*50;
  const larga = INCREMENTOS.find(r=>r.id==="c_larga");
  const post = h>=1.5 && larga ? Math.round(incTotal(larga)*RACION_HC) : 0;
  const horasToma = Math.max(0, h-0.5); // se empieza a tomar a los 30–45 min
  let gh=0, porque="";
  if(h<1.25){ gh=0; }
  else if(prio==="rendimiento"){
    gh = h<=2.5 ? 60 : (FICHA.intestinoEntrenado ? (h>=4?120:90) : 90);
    porque = h<=2.5 ? "Para 1–2,5 h se recomiendan 30–60 g/h; apuntamos a 60." : FICHA.intestinoEntrenado ? "Más de 2,5 h y con el intestino entrenado: 90–120 g/h, mezclando glucosa y fructosa (geles 2:1 o 1:0,8)." : "Más de 2,5 h: hasta 90 g/h, mezclando glucosa y fructosa (geles 2:1).";
  } else {
    // perder grasa: tomar lo justo para no acabar con un déficit extra enorme
    const necesario = Math.max(0, gasto - FICHA.entrenoIncluido - post - FICHA.deficitMaxSesion);
    const tope = 60; // en pérdida de grasa no pasamos de 60 g/h; el resto, después
    gh = Math.min(tope, Math.max(h>=1.5?30:0, Math.round(necesario/4/horasToma/5)*5));
    porque = `Lo justo para que el entreno no te deje más de ≈${FICHA.deficitMaxSesion} kcal de déficit extra (máximo ${tope} g/h).`;
  }
  const tomasH = gh ? Math.max(1, Math.round(gh/22.5)) : 0;
  const totalG = Math.round(gh*horasToma/5)*5, kcalIntra = totalG*4, totalTomas = Math.round(tomasH*horasToma);
  const extraGasto = Math.max(0, gasto - FICHA.entrenoIncluido); // lo que tu dieta no cubre ya
  const defSin = Math.max(0, extraGasto - post), defCon = Math.max(0, extraGasto - post - kcalIntra);
  let m=`🥤 <b>Tu intraentreno</b> (${dep==="correr"?"correr":dep==="bici"?"bici":"entreno"} de ${fr(h)} h · ≈${gasto} kcal${k?"":" estimadas"})\n<b>Prioridad: ${prio==="grasa"?"perder grasa":"rendimiento"}</b>`;
  if(!tomasH){
    m+=`\n<b>No necesitas tomar nada durante el entreno</b>, solo agua. Con menos de 1 h 15 min no hace falta.`;
  } else {
    const cada = Math.round(60/tomasH);
    m+=`<div class="plate"><div><span>Objetivo</span><span><b>≈${gh} g de hidratos por hora</b></span></div><div><span>Cómo</span><span><b>${tomasH} toma${tomasH>1?"s":""} por hora</b>: 1 cada ${cada} min</span></div><div><span>Empieza</span><span>a los 30–45 min, no esperes a tener hambre</span></div><div><span>Total</span><span>≈${totalTomas} tomas · ≈${totalG} g · ≈${kcalIntra} kcal</span></div></div><span class="note"><b>1 toma</b> (≈20–25 g de hidratos) es cualquiera de estas:</span><ul>${TOMAS.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><span class="note">${esc(porque)} Bebe agua o isotónico a sorbos (unos 400–700 ml por hora, según calor y sudor).${gh>60?" Si nunca has tomado tanto, súbelo poco a poco en los entrenos para acostumbrar el estómago.":""}</span>`;
  }
  m+=`<span class="note">Déficit extra = lo que gastas por encima del entreno que ya cubre tu dieta (≈${FICHA.entrenoIncluido} kcal), menos lo que comes durante y después.</span><div class="plate"><div><span>Sin tomar nada</span><span>déficit extra ≈${defSin} kcal</span></div><div><span>Con este plan</span><span><b>déficit extra ≈${defCon} kcal</b></span></div></div>`;
  let extraR=0;
  if(prio==="grasa"){
    if(h>=1.25 && defCon > FICHA.deficitMaxSesion+100){
      extraR = half((defCon-FICHA.deficitMaxSesion)/RACION_HC);
      m+=`<span class="note">Aun así el déficit queda alto. <b>Después del entreno, añade además:</b></span>`+bloqueHC("Comida o cena de después",extraR).replace("Por ejemplo, añade:","Por ejemplo:");
    }
    m+=`<span class="note">💡 <b>Por qué no conviene llegar con un déficit enorme:</b> después de un entreno largo sin comer nada, el hambre se dispara y es fácil acabar comiendo mucho más de lo que has gastado. Con un déficit moderado sigues perdiendo grasa y llegas a casa con un hambre normal.</span>`;
  }
  if(post) m+=`\n<span class="note">Ya está contado tu ajuste normal de tirada larga (+${fr(incTotal(larga))} raciones de hidratos después).</span>`;
  bot(m);
  const b=[];
  if(post) b.push({t:"🍽️ Ver mi ajuste de después",f:()=>ajusteDia([larga])});
  if(extraR) b.push({t:`📊 Opciones para +${fr(extraR)} extra`,f:()=>tablaHC(extraR,`Añade después del entreno: +${fr(extraR)} ${extraR>1?"raciones":"ración"} de hidratos`)});
  b.push({t:"🔁 Cambiar prioridad",f:()=>intraPlan(dep,h,k,prio==="grasa"?"rendimiento":"grasa")});
  opts(b);
}

  return [...fs].sort().map(f=>{ const n=alcDia(f), r=V[f]||{}; return {f, p:puntosDia(r, f), alc:n, conf:!!r.alcOk, q:!!V[f], pen:penDe(r, n).total, o3: r.o3 ? r.o3==="si" : null}; });
}
const diasEntre = (a,b) => Math.round((deISO(b)-deISO(a))/864e5)+1;
/* día del Vital Score diario: hoy si ya ha contestado el cuestionario; si no, ayer */
const vsDiaRef = () => vsDatos()[fechaISO()] ? 0 : 1;
function vsPeriodo(tipo, atras=0){
  if(tipo==="dia") atras += vsDiaRef();
  const fin=fechaISO(sumarDias(new Date(),-atras)), ini=vsInicio();
  const nDias = {dia:1, semana:7, mes:30}[tipo];
  let desde = nDias ? fechaISO(sumarDias(deISO(fin),-(nDias-1))) : ini;
  if(desde<ini) desde=ini; if(fin<desde) return {score:null, pil:{}, n:0};
  const dias=vsDiasLocal(desde,fin), V=vsDatos(), hayDatos=dias.some(d=>d.q) || Object.keys(entDatos()).length;
  return vsCalcular(dias, diasEntre(desde,fin), FICHA.fumador, {fuerza: hayDatos ? fuerzaPeriodo(f=>entDia(f,V), pautaEnt(), desde, fin) : null});
}
function racha(test){
  let n=0, d=new Date(); const t0=test(fechaISO(d));
  if(t0===false) return 0; if(t0!==true) d=sumarDias(d,-1);
  for(let i=0;i<5000;i++){ if(test(fechaISO(d))!==true) break; n++; d=sumarDias(d,-1); }
  return n;
}
function recordDe(test){
  let best=0, cur=0, d=deISO(vsInicio()); const hoy=fechaISO();
  for(let i=0;i<5000 && fechaISO(d)<=hoy;i++){ if(test(fechaISO(d))===true){ cur++; best=Math.max(best,cur); } else cur=0; d=sumarDias(d,1); }
  return best;
}

  {max:40,  n:"Baja",     ring:"#7CC04B", text:"#3B7D23", track:"#E6F3DC"},

const indiceAdic = ptsAzucar => ptsAzucar==null ? null : 100-ptsAzucar;
/* Índice acumulado con memoria: cada día contestado lo mueve un 12 % hacia el consumo de ese día.
   Dos semanas sin azúcar bajan un 80 % a un 13 %; un atracón lo sube, pero sin dispararlo. */
const ADIC_ALFA = 0.12;
function serieAdic(){
  const V=vsDatos(), fs=Object.keys(V).sort(), out=[]; let idx=null;
  fs.forEach(f=>{ const pz=puntosDia(V[f],f).azucar; if(pz==null) return; const c=100-pz;
    idx = idx==null ? c : idx*(1-ADIC_ALFA) + c*ADIC_ALFA; out.push({f, idx:Math.round(idx), dia:c}); });
  return out;
}
const AZ_DIA = [[0,"Sin azúcar"],[30,"Bajo"],[60,"Moderado"],[85,"Alto"],[100,"Muy alto"]];

function anillo(v, size, stroke, txt, banda=vsBanda){
  const r=(size-stroke)/2, c=2*Math.PI*r, b=v==null?{ring:"#cfd8cf",track:"#e6ebe5"}:banda(v), dash=v==null?0:Math.max(0.01,v/100*c), h=size/2;
  return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${b.track}" stroke-width="${stroke}"/>${v==null?"":`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${b.ring}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${h} ${h})"/>`}</svg><span class="ringv">${txt}</span></span>`;
}

/* --- sincronización con la base de datos (solo si el cliente tiene token) --- */
const pendKey = () => "mogas-vs-pend-" + (FICHA.codigo||"DEMO");
let SUBIENDO=false;
async function vsSubir(f){
  if(!nubeOn() || !FICHA.token || PREVIEW) return;
  const pend=new Set(store.get(pendKey())||[]); if(f) pend.add(f); store.set(pendKey(),[...pend]);
  if(SUBIENDO) return; SUBIENDO=true;
  try{
    for(const x of [...pend]){
      const r=vsDatos()[x]; if(!r){ pend.delete(x); continue; }
      try{ await nube("/rest/v1/rpc/guardar_dia",{method:"POST", body:{p_codigo:FICHA.codigo, p_token:FICHA.token, p_fecha:x, p_datos:{...r, alc:alcDia(x), ent:entDia(x), pauta:pautaEnt(), pasosDia:pasDatos().d[x]??null}, p_puntos:puntosDia(r,x)}}); pend.delete(x); }
      catch(e){ if(/fecha/.test(e.message)) pend.delete(x); else break; }
    }
  } finally { store.set(pendKey(),[...pend]); SUBIENDO=false; }
}
async function vsBajar(){
  if(!nubeOn() || !FICHA.token || PREVIEW) return;
  try{
    const rows=await nube("/rest/v1/rpc/mis_dias",{method:"POST", body:{p_codigo:FICHA.codigo, p_token:FICHA.token}});
    const V=vsDatos(), P=pasDatos(); let cambio=false;

    if(cambio){ vsGuardar(V); pasGuardar(P); if(TAB==="vs" && !Q) vsHome(); else vsBarPintar(); }
  }catch(e){}
  vsSubir();
}

const entKey = () => "mogas-ent-" + (FICHA.codigo||"DEMO");

/* entrenos de un día: lo apuntado manda; si no hay nada, los cuestionarios antiguos ("¿has entrenado?") cuentan como una sesión */
function entDia(f, V){
  const l=entDatos()[f]; if(l && l.length) return l;
  const r=(V||vsDatos())[f]; if(r && r.ent) return r.ent;
  if(r && r.entreno==="si") return [{t:r.tipo||"fuerza"}];
  return [];
}
/* valor de cada sesión frente a la pauta (no se enseña al cliente) */
function valorSesion(s){
  if(s.t==="cardio") return FICHA.perfil==="resist" ? ((s.min||45)>=30 ? 1 : 0.7) : ((s.min||45)>=45 ? 0.85 : 0.6);   // el cardio también cuenta como entreno
  return ({fuerza:1, crossfit:1, hyrox:1, dirigida:0.75, pilates:0.75, yoga:0.55})[s.t] ?? 0.6;
}
const pautaEnt = () => Math.max(1, +FICHA.entrenosSemana || 3);
function semanaEnt(f, getEnt, pauta){
  const lun=lunesDe(deISO(f)); let n=0, v=0;
  for(let i=0;i<7;i++){ const x=fechaISO(sumarDias(lun,i)); getEnt(x).forEach(s=>{ n++; v+=valorSesion(s); }); }
  return {n, v, pauta};
}
/* nota de fuerza de un periodo: media de las semanas; las semanas incompletas se comparan con lo que tocaba hasta ese día */
function fuerzaPeriodo(getEnt, pauta, desde, fin){
  const notas=[]; let lun=lunesDe(deISO(desde));
  while(fechaISO(lun)<=fin){
    const ini = fechaISO(lun)<desde ? desde : fechaISO(lun), finS = fechaISO(sumarDias(lun,6))>fin ? fin : fechaISO(sumarDias(lun,6));
    const dias=diasEntre(ini, finS);
    if(dias>=3){ let v=0; for(let d=deISO(ini); fechaISO(d)<=finS; d=sumarDias(d,1)) getEnt(fechaISO(d)).forEach(s=>v+=valorSesion(s));
      notas.push(Math.min(100, Math.round(v/(pauta*dias/7)*100))); }
    lun=sumarDias(lun,7);
  }
  return notas.length ? Math.round(notas.reduce((a,b)=>a+b,0)/notas.length) : null;
}
const sesionTxt = s => s.t==="cardio" ? `${CARDIO_NOM[s.sub]||"Cardio"}` : ENT_NOM[s.t]||s.t;

function entrenoApuntar(diaSel){
  const hoy=fechaISO(), ayer=fechaISO(new Date(Date.now()-864e5));
  diaSel = diaSel || hoy;
  const nuevo={t:null, sub:null, min:null, kcal:null};
  bot(`<b>🏋️ Apunta tu entreno</b>
<div class="bebdia"><button type="button" data-d="${hoy}" class="${diaSel===hoy?"on":""}">Hoy</button><button type="button" data-d="${ayer}" class="${diaSel===ayer?"on":""}">Ayer</button></div>
<div class="entlista"></div>
<div class="entf"><span class="entl">¿Qué has hecho?</span><div class="entg ent-t">${ENT_TIPOS.map(([v,t])=>`<button type="button" data-t="${v}">${t}</button>`).join("")}</div>
<div class="ent-cardio" hidden><span class="entl">¿Qué cardio?</span><div class="entg ent-s">${CARDIO.map(([v,t])=>`<button type="button" data-s="${v}">${t}</button>`).join("")}</div></div>
<span class="entl">¿Cuánto rato?</span><div class="entg ent-m">${ENT_DUR.map(m=>`<button type="button" data-m="${m}">${m<60?`${m} min`:m===60?"1 h":m===90?"1 h 30 min":"2 h"}</button>`).join("")}</div>
<div class="entin"><label><span>Otro (min)</span><input type="number" inputmode="numeric" min="5" max="600" class="ent-mi" placeholder="min"></label><label><span>Kcal (opcional)</span><input type="number" inputmode="numeric" min="0" max="5000" class="ent-k" placeholder="kcal"></label></div>
<p class="enterr warn"></p>
<button type="button" class="bebok entok">✅ Guardar entreno</button></div>`);
  const box=chat.lastElementChild;
  const pintarLista=()=>{ const l=entDatos()[diaSel]||[], s=semanaEnt(diaSel, f=>entDatos()[f]||entDia(f), pautaEnt());
    box.querySelector(".entlista").innerHTML = (l.length ? l.map((x,i)=>`<div class="enti"><span><b>${esc(sesionTxt(x))}</b>${x.min?` · <span>${x.min} min</span>`:""}${x.kcal?` · <span>${x.kcal} kcal</span>`:""}</span><button type="button" class="entx" data-i="${i}" aria-label="Borrar">✕</button></div>`).join("")
      : `<p class="note">${diaSel===hoy?"Hoy aún no has apuntado ningún entreno.":"Ayer no apuntaste ningún entreno."}</p>`)
      + `<div class="entsem"><span>${s.n===1?`Esta semana: 1 entreno de ${s.pauta}`:`Esta semana: ${s.n} entrenos de ${s.pauta}`}</span></div>`;
    box.querySelectorAll(".entx").forEach(b=>b.onclick=()=>{ if(!confirm(trT("¿Borrar este entreno?"))) return; const D=entDatos(), L=D[diaSel]||[]; L.splice(+b.dataset.i,1); if(L.length) D[diaSel]=L; else delete D[diaSel]; entGuardar(D); vsSyncEnt(diaSel); pintarLista(); }); };
  const marcar=(sel,attr,val)=>box.querySelectorAll(sel+" button").forEach(b=>b.classList.toggle("on",b.dataset[attr]===String(val)));
  box.querySelectorAll(".ent-t button").forEach(b=>b.onclick=()=>{ nuevo.t=b.dataset.t; marcar(".ent-t","t",nuevo.t); box.querySelector(".ent-cardio").hidden = nuevo.t!=="cardio"; if(nuevo.t!=="cardio") nuevo.sub=null; });
  box.querySelectorAll(".ent-s button").forEach(b=>b.onclick=()=>{ nuevo.sub=b.dataset.s; marcar(".ent-s","s",nuevo.sub); });
  box.querySelectorAll(".ent-m button").forEach(b=>b.onclick=()=>{ nuevo.min=+b.dataset.m; marcar(".ent-m","m",nuevo.min); box.querySelector(".ent-mi").value=""; });
  box.querySelector(".ent-mi").oninput=e=>{ const v=Math.round(+e.target.value); nuevo.min = v>0 ? v : null; marcar(".ent-m","m",-1); };
  box.querySelector(".ent-k").oninput=e=>{ const v=Math.round(+e.target.value); nuevo.kcal = v>0 ? v : null; };
  box.querySelector(".entok").onclick=()=>{
    const er=box.querySelector(".enterr");
    if(!nuevo.t){ er.textContent=trT("Elige qué entreno has hecho."); return; }
    if(nuevo.t==="cardio" && !nuevo.sub){ er.textContent=trT("Elige qué tipo de cardio."); return; }
    if(!nuevo.min){ er.textContent=trT("Elige cuánto rato ha durado."); return; }
    er.textContent="";
    const D=entDatos(), L=D[diaSel]||[]; L.push({t:nuevo.t, ...(nuevo.sub?{sub:nuevo.sub}:{}), min:nuevo.min, ...(nuevo.kcal?{kcal:nuevo.kcal}:{})}); D[diaSel]=L; entGuardar(D); vsSyncEnt(diaSel);
    const s=semanaEnt(diaSel, f=>entDia(f), pautaEnt());
    box.querySelectorAll(".entf button.on").forEach(b=>b.classList.remove("on")); box.querySelector(".ent-mi").value=""; box.querySelector(".ent-k").value=""; box.querySelector(".ent-cardio").hidden=true;
    Object.assign(nuevo,{t:null,sub:null,min:null,kcal:null}); pintarLista();
    const op=box.nextElementSibling; if(op && op.classList.contains("opts")) op.remove();
    bot(`<b>✅ Entreno guardado</b>\n<span>${s.n===1?`Esta semana: 1 entreno de ${s.pauta}`:`Esta semana: ${s.n} entrenos de ${s.pauta}`}</span>${s.n>=s.pauta?`\n<span>¡Pauta de la semana cumplida!</span>`:""}`);
    opts([{t:"🏋️ Apuntar otro entreno", f:()=>entrenoApuntar(diaSel)}]);
  };
  box.querySelectorAll(".bebdia button").forEach(b=>b.onclick=()=>{ if(b.dataset.d===diaSel) return; box.remove(); const o=chat.lastElementChild; if(o&&o.classList.contains("opts")) o.remove(); entrenoApuntar(b.dataset.d); });
  pintarLista();
  opts([]);
}
/* cuando cambian los entrenos de un día con cuestionario, se vuelve a subir */
function vsSyncEnt(f){ const V=vsDatos(); if(V[f]){ V[f].ent=entDatos()[f]||[]; delete V[f].entreno; delete V[f].tipo; vsGuardar(V); vsSubir(f); } }

/* =========== PESTAÑA APUNTAR: pasos, entrenos y bebidas =========== */
function apuntarMenu(){
  SECCION=null; if(TAB!=="apuntar") marcarTab("apuntar");
  const hoy=fechaISO(), ps=pasDatos().d[hoy], B=bebDatos()[hoy], s=semanaEnt(hoy, f=>entDia(f), pautaEnt());
  const nAlc=B?Object.entries(B).reduce((a,[id,c])=>a+(UNID_ALC[id]?UNID_ALC[id]*c:0),0):0;
  const w=document.createElement("div"); w.className="apgrid";
  const tarjetas=[
    {ico:"🚶", t:"Pasos", sub: ps!=null?`Hoy: ${fmtN(ps)} pasos`:"Hoy aún no los has apuntado", f:pasosApuntar},
    {ico:"🏋️", t:"Entrenos", sub: s.n===1?`Esta semana: 1 entreno de ${s.pauta}`:`Esta semana: ${s.n} entrenos de ${s.pauta}`, f:()=>entrenoApuntar()},
    {ico:"🍹", t:"Bebidas", sub: B?(nAlc?`Hoy: ${kcalDia(B)} kcal · ${nAlc} de alcohol`:`Hoy: ${kcalDia(B)} kcal en bebidas`):"Hoy: ninguna apuntada", f:()=>bebidasApuntar()}];
  w.innerHTML=`<div class="aptit">¿Qué quieres apuntar?</div>`+tarjetas.map((x,i)=>`<button type="button" class="apcard" data-i="${i}"><span class="qi">${x.ico}</span><span><b>${x.t}</b><small>${x.sub}</small></span><span class="apmas" aria-hidden="true">+</span></button>`).join("")
    +`<div class="apsec"><button type="button" data-o="sem">📅 Poner la media de pasos de una semana</button><button type="button" data-o="ps">📊 Ver mis semanas de pasos</button><button type="button" data-o="bm">📊 Resumen de bebidas del mes</button></div>`;
  w.querySelectorAll(".apcard").forEach(b=>b.onclick=()=>{ const x=tarjetas[+b.dataset.i]; w.remove(); me(`${x.ico} ${trT(x.t)}`); setTimeout(()=>x.f(),250); });
  const otras={sem:["📅 Poner la media de pasos de una semana",pasosMediaSemana],ps:["📊 Ver mis semanas de pasos",()=>pasosResumen()],bm:["📊 Resumen de bebidas del mes",()=>bebidasResumen()]};
  w.querySelectorAll(".apsec button").forEach(b=>b.onclick=()=>{ const [txt,fn]=otras[b.dataset.o]; w.remove(); me(trT(txt)); setTimeout(fn,250); });
  chat.appendChild(w); requestAnimationFrame(()=>{ chat.scrollTop=Math.max(0,w.offsetTop-chat.offsetTop-8); });
}
/* --- Arranque --- */
(async function(){
  const m = location.hash.match(/^#d=([A-Za-z0-9_\-]+)$/);
  if(m){
    try{ const d=await desempaquetar(m[1]); aplicarDatos(d); store.set("mogas-dieta",datosActuales()); store.del("mogas-fuera"); store.del("mogas-modo"); store.del("mogas-codigo");
      history.replaceState(null,"",location.pathname); start(); return; }
    catch(e){ history.replaceState(null,"",location.pathname); login(); document.getElementById("err").textContent="El enlace no es válido o está incompleto. Pide a tu nutricionista que te lo vuelva a enviar."; return; }
  }
  window.addEventListener("hashchange",()=>{ if(/^#(d=|r=|panel$)/.test(location.hash)) location.reload(); });
  const r = location.hash.match(/^#r=([A-Za-z0-9_\-]+)$/);
  if(r){ const h=location.hash; history.replaceState(null,"",location.pathname);
    if(store.get("mogas-modo")==="nutri"){ const res=await alimImportar(h); panelInicio(res.msg); return; }
    login(); document.getElementById("err").textContent="Este enlace es para tu nutricionista: ábrelo desde su panel («📥 Recibir respuesta de un cliente»)."; return; }
  if(location.hash==="#panel"){ history.replaceState(null,"",location.pathname); store.set("mogas-modo","nutri"); panelInicio(); return; }
  if(store.get("mogas-modo")==="nutri"){ panelInicio(); return; }
  const mia=store.get("mogas-dieta"); if(mia && mia.f && !store.get("mogas-fuera")){ aplicarDatos(mia); start(); return; }
  let c=null; try{c=localStorage.getItem("mogas-codigo")}catch(e){} if(c && cargarCliente(c)) start(); else login();
})();
